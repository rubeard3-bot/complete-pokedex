name: Weekly card price refresh

on:
  schedule:
    # Sundays 07:00 UTC (~2-3 AM US Eastern)
    - cron: '0 7 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The pipeline resumes from .cache/ if a previous run was interrupted,
      # and PokéAPI responses stay valid between weeks — only card prices
      # are force-refreshed below. restore/save are split so the cache is
      # saved even when the job fails (the combined action skips saving on
      # failure, which would lose all progress from a partial run).
      - name: Restore API cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: api-cache-${{ github.run_id }}
          restore-keys: |
            api-cache-

      # Transient upstream 5xx errors (PokéAPI/TCGdex hiccups) fail a single
      # pipeline pass; each retry resumes from .cache/, so only the failed
      # items are re-fetched.
      - name: Refresh card prices
        run: |
          for attempt in 1 2 3; do
            if npm run update-data -- --refresh-prices; then
              exit 0
            fi
            echo "::warning::Pipeline attempt ${attempt} failed; retrying in 90s..."
            sleep 90
          done
          echo "::error::Pipeline failed after 3 attempts"
          exit 1

      - name: Save API cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: api-cache-${{ github.run_id }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/sprites scripts/last-run-report.json
          if git diff --cached --quiet; then
            echo "No price changes this week."
          else
            git commit -m "chore: weekly card price refresh"
            # main may have moved during the hour-long run; replay our
            # data commit on top of whatever is there now
            git pull --rebase origin main
            git push
          fi

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: last-run-report
          path: scripts/last-run-report.json
          if-no-files-found: ignore
